<!doctype html>
<html>
<head><meta charset="utf-8"><title>grass repeat probe</title></head>
<body>
<!-- The no-repeat check's page (scripts/perf/grass-repeat.mjs opens it on a dev server): the game's own ground painter bakes an open, flat,
     all-grass piece of ground (no roads, lots, trees, map decals or stripes) at a camera zoom, stitched from its chunks, and hands it back as
     a PNG. window.probe({ zoom, dpr, art: 'painted' | 'photo', x, y, size }) -->
<script type="module">
import { Textures } from '/src/game/textures.ts';
import { GroundPainter } from '/src/game/renderer.ts';
import { RoadNetwork } from '/src/game/network.ts';
import { GROUND_ART } from '/src/game/ground-art.ts';
import { withBaseGrass } from '/src/game/base-grass-saved.ts';
import { withPresets } from '/src/game/paint-presets-saved.ts';
import { blendMetres, grassDetailWeights, grassZoomLevels } from '/src/game/painted-grass-lod.ts';
import { PAINTED_GRASS } from '/src/game/painted-grass-art.ts';
import { CHUNK_H, CHUNK_W, MAP, MID_K } from '/src/game/iso.ts';
import { HS } from '/src/game/terrain/types.ts';

const tex = new Textures(), art = withPresets(withBaseGrass(GROUND_ART));
const ready = tex.build(art);
const painter = new GroundPainter(new Uint8Array(MAP * MAP), new RoadNetwork(), tex);
painter.setTerrain(new Uint8Array(MAP * MAP), new Float32Array(HS * HS), []);
painter.drawDressing = () => {}; // the map decals are not the grass texture
window.probe = async ({ zoom, dpr = 2, art: grassArt = 'painted', x = 1024, y = 1024, size = 2048 }) => {
  await ready;
  tex.configure({ ...art, grassArt }); painter.resetPlanColours();
  const { district, artL, rasterL: L } = grassZoomLevels(zoom, dpr), k = district ? MID_K : 1, CW = CHUNK_W * k, CH = CHUNK_H * k;
  await tex.preparePainted(artL, ['grass']);
  // a size x size px window (at the chunk's bake density) centred on tile (x, y), stitched from the chunks under it
  const X = (x - y) * 64, Y = (x + y) * 32, X0 = X - size / 2 / L, Y0 = Y - size / 2 / L, X1 = X + size / 2 / L, Y1 = Y + size / 2 / L;
  const out = new OffscreenCanvas(size, size), g = out.getContext('2d');
  const t0 = performance.now(); let n = 0;
  for (let j = Math.floor(Y0 / CH); j <= Math.floor(Y1 / CH); j++) for (let i = Math.floor(X0 / CW); i <= Math.floor(X1 / CW); i++) {
    const cv = painter.paint(i, j, L, district); n++;
    g.drawImage(cv, Math.round((i * CW - X0) * L), Math.round((j * CH - Y0) * L));
  }
  const ms = (performance.now() - t0) / n, blob = await out.convertToBlob({ type: 'image/png' }), buf = new Uint8Array(await blob.arrayBuffer());
  let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode(...buf.subarray(i, i + 0x8000));
  const period = blendMetres(PAINTED_GRASS.grass, grassDetailWeights(artL).map(w => w.detail)) / 2;
  return { png: btoa(s), artL, L, district, period, chunks: n, msPerChunk: +ms.toFixed(1) };
};
window.probeReady = ready.then(() => true);
</script>
</body>
</html>
