<!doctype html><meta charset="utf-8"><title>CapitalEmpire bunker package preview</title><style>body{font:15px system-ui;background:#182018;color:#eee6cf;margin:28px}button,select{font:inherit;padding:8px;margin-right:12px}canvas{max-width:100%;background:url('./textures/fairway-seamless.png');display:block;margin-top:20px}img{max-width:100%;background:url('./textures/fairway-seamless.png')}</style><h1>CapitalEmpire bunker appearance package</h1><p>Game-native projection; approved materials and profile. This preview does not change the game.</p><img src="./assets/game-native/1024.webp" alt="Pre-baked approved appearance"><p><select id="depth"><option value="0.15">Shallow</option><option value="0.45">Medium</option><option value="0.9">High</option><option value="1.5" selected>Deep</option></select><button id="bake">Test edit-time worker bake</button><span id="status">Pre-baked image above; no 3D work while viewing.</span></p><canvas></canvas><script type="module">import{WorkerBunkerBaker}from'./baker/bake-client.js';import{APPROVED_APPEARANCE}from'./approved-preset.js';import{GAME_PROJECTION}from'./runtime/capital-empire-adapter.js';const look=await fetch('./approved-look.json').then(r=>r.json());let baker,sprite;document.querySelector('#bake').onclick=async()=>{const b=document.querySelector('#bake');b.disabled=true;document.querySelector('#status').textContent='Baking once in a worker…';try{baker??=new WorkerBunkerBaker();sprite?.image.close();sprite=await baker.bake({key:'package-preview:'+document.querySelector('#depth').value,guide:{...look.grid,originTiles:{x:0,y:0}},appearance:{...APPROVED_APPEARANCE,depth:Number(document.querySelector('#depth').value)},projection:GAME_PROJECTION,maxEdge:1024,rasterScale:.6});const c=document.querySelector('canvas');c.width=sprite.width;c.height=sprite.height;c.getContext('2d').drawImage(sprite.image,0,0);document.querySelector('#status').textContent='Cached '+sprite.width+'×'+sprite.height+' image; '+Math.round(sprite.bakeMs)+' ms edit-time bake.';}catch(e){document.querySelector('#status').textContent=e.message;}finally{b.disabled=false;}};addEventListener('pagehide',()=>{sprite?.image.close();baker?.dispose();});</script>
